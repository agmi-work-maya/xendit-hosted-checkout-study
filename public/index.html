<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xendit Payment Request Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input, select, button { width: 100%; padding: .6rem; margin-top: .3rem; box-sizing: border-box; font-size: 1rem; }
  button { margin-top: 1.5rem; cursor: pointer; }
  pre { background: #f4f4f4; padding: .75rem; overflow: auto; font-size: .8rem; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>Pay with Xendit</h1>
<p><a href="/checkout.html">Hosted checkout (Sessions API) &rarr;</a></p>
<form id="form">
  <label>Amount (IDR) <input name="amount" type="number" min="1" value="10000" required></label>
  <label>Channel
    <select name="channel_code">
      <option value="SHOPEEPAY">ShopeePay</option>
      <option value="OVO">OVO</option>
      <option value="DANA">DANA</option>
      <option value="LINKAJA">LinkAja</option>
    </select>
  </label>
  <label>Description <input name="description" value="Test order"></label>
  <button type="submit">Pay</button>
</form>
<p id="msg" class="err"></p>
<pre id="out" hidden></pre>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const out = document.getElementById('out');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.textContent = '';
  const body = Object.fromEntries(new FormData(form));
  const res = await fetch('/api/payment-requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) { msg.textContent = data.error || 'Failed'; out.hidden = false; out.textContent = JSON.stringify(data, null, 2); return; }
  if (data.redirect_url) { location.href = data.redirect_url; return; }
  out.hidden = false;
  out.textContent = JSON.stringify(data.payment_request, null, 2);
});
</script>
</body>
</html>
